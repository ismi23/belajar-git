name: CI - Pemeriksaan Kode

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  check-code:
    name: Pemeriksaan JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil kode repository
        uses: actions/checkout@v4

      - name: Memeriksa sintaks JavaScript
        run: node --check project-to-do-list/script.js