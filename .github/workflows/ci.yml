name: Cek Project To-Do List

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil kode repository
        uses: actions/checkout@v4

      - name: Memeriksa file project
        run: |
          test -f project-to-do-list/index.html
          test -f project-to-do-list/style.css
          test -f project-to-do-list/script.js
          echo "Semua file project tersedia!"
