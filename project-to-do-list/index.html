<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>To-Do List</h1>
            <p>Atur tugasmu dan selesaikan tepat waktu.</p>
        </header>

        <!-- Form Tambah Tugas -->
        <form id="task-form" class="task-form">

            <input
                type="text"
                id="task-input"
                placeholder="Masukkan nama tugas..."
                required
            >

            <!-- Deadline -->
            <input
                type="date"
                id="task-deadline"
            >

            <!-- Prioritas -->
            <select id="task-priority">
                <option value="Rendah">Prioritas Rendah</option>
                <option value="Sedang" selected>Prioritas Sedang</option>
                <option value="Tinggi">Prioritas Tinggi</option>
            </select>

            <!-- Kategori -->
            <select id="task-category">
                <option value="Kuliah">Kuliah</option>
                <option value="Kerja">Kerja</option>
                <option value="Pribadi">Pribadi</option>
                <option value="Lainnya" selected>Lainnya</option>
            </select>

            <!-- Pengulangan Tugas Harian -->
            <label class="repeat-option">
                <input
                    type="checkbox"
                    id="task-repeat"
                >
                <span>Ulangi setiap hari</span>
            </label>

            <button type="submit" class="add-button">
                + Tambah Tugas
            </button>

        </form>

        <!-- Pencarian Tugas -->
        <div class="search-container">
            <input
                type="text"
                id="search-input"
                placeholder="Cari nama, kategori, prioritas, atau deadline..."
            >
        </div>

        <!-- Filter Status Tugas -->
        <div class="task-filter">

            <button type="button" id="filter-all" class="active">
                Semua
            </button>

            <button type="button" id="filter-active">
                Belum Selesai
            </button>

            <button type="button" id="filter-completed">
                Selesai
            </button>

        </div>

        <!-- Filter Prioritas -->
        <div class="priority-filter">

            <h3>Filter Berdasarkan Prioritas</h3>

            <button type="button" id="filter-priority-all" class="active">
                Semua Prioritas
            </button>

            <button type="button" id="filter-low">
                Rendah
            </button>

            <button type="button" id="filter-medium">
                Sedang
            </button>

            <button type="button" id="filter-high">
                Tinggi
            </button>

        </div>

        <!-- Informasi Jumlah Tugas -->
        <div class="task-header">
            <h2>Daftar Tugas</h2>
            <span id="task-count">0 tugas</span>
        </div>

        <!-- Daftar Tugas -->
        <ul id="task-list" class="task-list">
        </ul>

        <!-- Footer -->
        <footer class="footer">
            <p>To-Do List &copy; 2026</p>
            <p>Saya sedang belajar Git Workflow.</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
