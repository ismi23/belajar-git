<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | Belajar Git</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header>
            <p class="eyebrow">PROJECT LATIHAN GIT</p>
            <h1>Daftar Tugas</h1>
            <p class="subtitle">Catat kegiatanmu dan selesaikan satu per satu.</p>
        </header>

        <!-- Form Tambah Tugas -->
        <form id="task-form" class="task-form">

            <input
                id="task-input"
                type="text"
                placeholder="Tulis tugas baru..."
                autocomplete="off"
                required
            >

            <input
                id="task-deadline"
                type="date"
                required
            >

            <select id="task-priority">
                <option value="Rendah">Prioritas Rendah</option>
                <option value="Sedang" selected>Prioritas Sedang</option>
                <option value="Tinggi">Prioritas Tinggi</option>
            </select>

            <button type="submit">+ Tambah Tugas</button>

        </form>

        <!-- Daftar Tugas -->
        <section class="task-section">

            <div class="section-heading">
                <h2>Tugas Saya</h2>
                <p>Kelola dan pantau semua kegiatanmu.</p>
                <span id="task-count">0 tugas</span>
            </div>

            <!-- Filter Tugas -->
            <div class="task-filter" id="task-filter">
                <button type="button" id="filter-all" class="active">
                    Semua
                </button>

                <button type="button" id="filter-active">
                    Belum Selesai
                </button>

                <button type="button" id="filter-completed">
                    Selesai
                </button>
            </div>

            <!-- Daftar -->
            <ul id="task-list" class="task-list">
                <li class="empty-state">
                    Belum ada tugas. Tambahkan tugas pertamamu!
                </li>
            </ul>

        </section>

        <footer>
            Project sederhana untuk latihan HTML, CSS, JavaScript, dan Git.
            <p>Saya sedang belajar Git Push dan Pull.</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
