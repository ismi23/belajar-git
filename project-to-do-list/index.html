<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | Belajar Git</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">PROJECT LATIHAN GIT</p>
      <h1>Daftar Tugas</h1>
      <p class="subtitle">Catat kegiatanmu dan selesaikan satu per satu.</p>
    </header>

    <form id="task-form" class="task-form">
      <input id="task-input" type="text" placeholder="Tulis tugas baru..." autocomplete="off" required>
      <button type="submit">Tambah</button>
    </form>

    <section class="task-section">
      <div class="section-heading">
        <h2>Tugas Saya</h2>
        <span id="task-count">0 tugas</span>
      </div>
      <ul id="task-list" class="task-list">
        <li class="empty-state">Belum ada tugas. Tambahkan tugas pertamamu!</li>
      </ul>
    </section>

    <footer>Project sederhana untuk latihan HTML, CSS, JavaScript, dan Git.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
